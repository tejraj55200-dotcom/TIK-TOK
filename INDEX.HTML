<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tik Tek Tok - Cyber Neon Edition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Orbitron for futuristic neon feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1035 0%, #0c0817 70%, #05030a 100%);
      min-height: 100vh;
      color: #f1f5f9;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-neon {
      font-family: 'Orbitron', monospace;
    }

    /* Glassmorphism cards */
    .glass-card {
      background: rgba(22, 17, 43, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .glass-inset {
      background: rgba(11, 7, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Neon glow effects */
    .glow-cyan {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);
    }
    .glow-pink {
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.45);
    }

    .text-glow-cyan {
      text-shadow: 0 0 12px rgba(6, 182, 212, 0.8), 0 0 30px rgba(6, 182, 212, 0.4);
    }
    .text-glow-pink {
      text-shadow: 0 0 12px rgba(236, 72, 153, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
    }

    /* Grid Cell Transitions */
    .cell-btn {
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cell-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(30, 24, 58, 0.85);
    }
    .cell-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }

    /* Winning Tile Pulse */
    @keyframes winPulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1.2);
      }
      50% {
        transform: scale(1.04);
        filter: brightness(1.4);
      }
    }
    .win-cell-x {
      animation: winPulse 1.2s infinite ease-in-out;
      background: rgba(6, 182, 212, 0.2) !important;
      border-color: #06b6d4 !important;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.6) !important;
    }
    .win-cell-o {
      animation: winPulse 1.2s infinite ease-in-out;
      background: rgba(236, 72, 153, 0.2) !important;
      border-color: #ec4899 !important;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.6) !important;
    }

    /* Ambient background glowing orbs */
    .ambient-orb-1 {
      position: absolute;
      top: -10%;
      left: 10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
      z-index: 0;
    }
    .ambient-orb-2 {
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      filter: blur(60px);
      z-index: 0;
    }

    /* Custom Switch Toggle */
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.8), rgba(79, 70, 229, 0.9));
      color: #ffffff;
      box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-6 min-h-screen relative">
  <!-- Glowing Ambient Orbs -->
  <div class="ambient-orb-1"></div>
  <div class="ambient-orb-2"></div>

  <!-- Header -->
  <header class="w-full max-w-lg flex items-center justify-between z-10 pt-2 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-purple-900/40">
        <span class="font-neon font-black text-xl text-white">#</span>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black font-neon tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-pink-400 to-purple-400">
          TIK TEK TOK
        </h1>
        <p class="text-xs text-slate-400 font-medium">CYBER GLOW ARENA</p>
      </div>
    </div>

    <!-- Quick action controls -->
    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" class="p-2.5 rounded-xl glass-card hover:bg-slate-800/80 transition text-slate-300 hover:text-white" title="Toggle Sound">
        <i id="soundIcon" data-lucide="volume-2" class="w-5 h-5"></i>
      </button>
      <button id="settingsModalBtn" class="p-2.5 rounded-xl glass-card hover:bg-slate-800/80 transition text-slate-300 hover:text-white" title="Game Settings">
        <i data-lucide="sliders" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md flex flex-col items-center z-10 flex-1 justify-center space-y-4">
    
    <!-- Game Mode and Difficulty Selector Pill -->
    <div class="w-full flex items-center justify-between p-1.5 rounded-2xl glass-card text-xs sm:text-sm font-semibold">
      <div class="flex gap-1 w-full">
        <button id="modePvpBtn" class="tab-btn active flex-1 py-2 px-3 rounded-xl transition flex items-center justify-center gap-1.5">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>2 Players</span>
        </button>
        <button id="modeAiBtn" class="tab-btn flex-1 py-2 px-3 rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
          <i data-lucide="bot" class="w-4 h-4"></i>
          <span>VS AI</span>
        </button>
      </div>
    </div>

    <!-- AI Difficulty Row (Only visible when AI mode active) -->
    <div id="aiDifficultyContainer" class="w-full flex items-center justify-between px-3 py-2 rounded-xl glass-inset hidden text-xs transition-all duration-300">
      <span class="text-slate-400 font-medium flex items-center gap-1.5">
        <i data-lucide="cpu" class="w-3.5 h-3.5 text-purple-400"></i> AI Core:
      </span>
      <div class="flex gap-1">
        <button data-difficulty="easy" class="diff-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-medium transition">Casual</button>
        <button data-difficulty="medium" class="diff-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-medium transition">Tactical</button>
        <button data-difficulty="unbeatable" class="diff-btn px-2.5 py-1 rounded-lg bg-pink-500/20 text-pink-400 border border-pink-500/40 font-bold transition">Master (AI)</button>
      </div>
    </div>

    <!-- Score Board -->
    <div class="w-full grid grid-cols-3 gap-2.5">
      <!-- Player X -->
      <div id="cardPlayerX" class="glass-card rounded-2xl p-3 flex flex-col items-center border-l-2 border-l-cyan-400 transition-all duration-300">
        <div class="flex items-center gap-1 text-cyan-400 text-xs font-semibold mb-1">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          <span id="labelX" class="truncate max-w-[85px]">Player 1</span> (X)
        </div>
        <span id="scoreX" class="text-2xl font-black font-neon text-glow-cyan text-cyan-300">0</span>
      </div>

      <!-- Tie / Draws -->
      <div class="glass-card rounded-2xl p-3 flex flex-col items-center border-t-2 border-t-purple-400/60">
        <div class="text-slate-400 text-xs font-semibold mb-1 flex items-center gap-1">
          <i data-lucide="handshake" class="w-3 h-3 text-slate-400"></i> Draws
        </div>
        <span id="scoreDraw" class="text-2xl font-black font-neon text-slate-200">0</span>
      </div>

      <!-- Player O -->
      <div id="cardPlayerO" class="glass-card rounded-2xl p-3 flex flex-col items-center border-r-2 border-r-pink-400 transition-all duration-300">
        <div class="flex items-center gap-1 text-pink-400 text-xs font-semibold mb-1">
          <span class="w-2 h-2 rounded-full bg-pink-400"></span>
          <span id="labelO" class="truncate max-w-[85px]">Player 2</span> (O)
        </div>
        <span id="scoreO" class="text-2xl font-black font-neon text-glow-pink text-pink-300">0</span>
      </div>
    </div>

    <!-- Turn Indicator Banner -->
    <div class="w-full py-2 px-4 rounded-xl glass-inset flex items-center justify-between text-sm">
      <div class="flex items-center gap-2">
        <span class="relative flex h-3 w-3">
          <span id="turnPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span id="turnDot" class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
        </span>
        <span id="turnMessage" class="font-medium text-slate-300">Turn: <strong id="activePlayerName" class="text-cyan-400 font-bold">Player 1 (X)</strong></span>
      </div>
      <div id="aiThinkingStatus" class="hidden text-xs text-fuchsia-400 font-mono items-center gap-1">
        <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Calculating...
      </div>
    </div>

    <!-- Tic Tac Toe Grid Board -->
    <div class="relative w-full aspect-square max-w-[390px] p-3 rounded-3xl glass-card shadow-2xl flex items-center justify-center">
      <div class="grid grid-cols-3 grid-rows-3 gap-2.5 w-full h-full" id="boardGrid">
        <!-- 9 interactive board cells -->
        <button data-index="0" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="1" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="2" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="3" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="4" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="5" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="6" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="7" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
        <button data-index="8" class="cell-btn rounded-2xl glass-inset flex items-center justify-center text-4xl sm:text-5xl font-black font-neon text-slate-600 focus:outline-none"></button>
      </div>
    </div>

    <!-- Action Controls Bottom -->
    <div class="w-full flex items-center justify-center gap-3 pt-1">
      <button id="resetRoundBtn" class="flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 active:scale-95 text-white font-bold text-sm shadow-lg shadow-cyan-900/30 transition flex items-center justify-center gap-2">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        <span>Play Again</span>
      </button>

      <button id="resetScoreBtn" class="py-3 px-4 rounded-xl glass-card hover:bg-rose-950/40 hover:border-rose-500/40 text-slate-300 hover:text-rose-300 active:scale-95 font-semibold text-sm transition flex items-center justify-center gap-2" title="Reset all scoreboard wins">
        <i data-lucide="trash-2" class="w-4 h-4 text-rose-400"></i>
        <span class="hidden sm:inline">Reset Score</span>
      </button>
    </div>

  </main>

  <!-- Footer Info -->
  <footer class="mt-4 text-center text-xs text-slate-500 z-10 flex items-center gap-2">
    <span>Interactive Cyber Tic-Tac-Toe</span>
    <span>•</span>
    <span class="text-cyan-400">Clean & Modern</span>
  </footer>

  <!-- Settings & Customization Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="glass-card max-w-sm w-full rounded-3xl p-6 border border-white/10 shadow-2xl space-y-5 transform scale-95 transition-all">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold font-neon text-white flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-purple-400"></i> Settings
        </h2>
        <button id="closeSettingsModal" class="p-1 rounded-lg text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Player Names Settings -->
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-cyan-400 uppercase tracking-wider block mb-1">Player 1 Name (X)</label>
          <input id="inputNameX" type="text" maxlength="12" value="Player 1" class="w-full px-3 py-2 rounded-xl glass-inset text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 text-sm">
        </div>

        <div>
          <label class="text-xs font-semibold text-pink-400 uppercase tracking-wider block mb-1">Player 2 / AI Name (O)</label>
          <input id="inputNameO" type="text" maxlength="12" value="Player 2" class="w-full px-3 py-2 rounded-xl glass-inset text-white focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm">
        </div>
      </div>

      <!-- User Marker Pick for AI Mode -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">Your Starting Marker (VS AI)</label>
        <div class="grid grid-cols-2 gap-2">
          <button id="pickXBtn" class="py-2 rounded-xl border border-cyan-500/50 bg-cyan-500/20 text-cyan-300 font-neon font-bold text-center">
            Play as X (1st)
          </button>
          <button id="pickOBtn" class="py-2 rounded-xl border border-white/10 glass-inset text-slate-400 hover:text-pink-300 font-neon font-bold text-center">
            Play as O (2nd)
          </button>
        </div>
      </div>

      <!-- Sound Toggle Row inside modal -->
      <div class="flex items-center justify-between pt-2 border-t border-white/5">
        <span class="text-sm font-medium text-slate-300 flex items-center gap-2">
          <i data-lucide="volume-2" class="w-4 h-4 text-slate-400"></i> Sound Effects
        </span>
        <button id="modalSoundSwitch" class="w-12 h-6 flex items-center bg-cyan-600 rounded-full p-1 duration-300 cursor-pointer">
          <div id="soundSwitchKnob" class="bg-white w-4 h-4 rounded-full shadow-md transform translate-x-6 duration-300"></div>
        </button>
      </div>

      <button id="saveSettingsBtn" class="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 font-bold text-white text-sm shadow-lg shadow-purple-900/40 transition">
        Apply & Resume
      </button>
    </div>
  </div>

  <!-- In-Game Toast Notification Alert (No alert()) -->
  <div id="gameToast" class="fixed bottom-6 z-50 glass-card px-4 py-2.5 rounded-2xl border border-cyan-500/40 text-sm font-medium text-white shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
    <i id="toastIcon" data-lucide="sparkles" class="w-4 h-4 text-cyan-400"></i>
    <span id="toastMsg">Round started!</span>
  </div>

  <script>
    /* =====================================================================
       AUDIO SYNTHESIZER (Web Audio API)
       Self-contained, realistic retro-futuristic sound generator
    ===================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, gainLevel = 0.15) {
        if (this.muted) return;
        try {
          this.initContext();
          if (!this.ctx) return;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error("Audio error", e);
        }
      }

      playPlaceX() {
        // High pitch electronic ping
        this.playTone(587.33, 'triangle', 0.14, 0.2); // D5
        setTimeout(() => this.playTone(880, 'sine', 0.16, 0.15), 50); // A5
      }

      playPlaceO() {
        // Deep resonant electronic bloop
        this.playTone(392.00, 'sine', 0.14, 0.22); // G4
        setTimeout(() => this.playTone(329.63, 'triangle', 0.18, 0.18), 50); // E4
      }

      playWin() {
        // Victorious ascending arpeggio
        const notes = [440, 554.37, 659.25, 880]; // A major
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'triangle', 0.28, 0.22);
          }, idx * 90);
        });
      }

      playDraw() {
        // Descending tie sound
        const notes = [440, 415.3, 392, 349.23];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sawtooth', 0.2, 0.12);
          }, idx * 80);
        });
      }

      playClick() {
        this.playTone(800, 'sine', 0.05, 0.08);
      }
    }

    const sound = new SoundEngine();

    /* =====================================================================
       GAME STATE
    ===================================================================== */
    const WINNING_COMBOS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    const state = {
      board: Array(9).fill(null),
      currentPlayer: 'X',
      gameActive: true,
      gameMode: 'pvp', // 'pvp' or 'ai'
      aiDifficulty: 'unbeatable', // 'easy', 'medium', 'unbeatable'
      humanMarker: 'X',
      aiMarker: 'O',
      isAiThinking: false,
      scores: {
        X: 0,
        O: 0,
        draws: 0
      },
      playerNames: {
        X: 'Player 1',
        O: 'Player 2'
      }
    };

    /* =====================================================================
       DOM ELEMENTS
    ===================================================================== */
    const boardCells = document.querySelectorAll('.cell-btn');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDrawEl = document.getElementById('scoreDraw');
    const labelXEl = document.getElementById('labelX');
    const labelOEl = document.getElementById('labelO');
    const cardPlayerX = document.getElementById('cardPlayerX');
    const cardPlayerO = document.getElementById('cardPlayerO');
    const turnMessageEl = document.getElementById('turnMessage');
    const turnPing = document.getElementById('turnPing');
    const turnDot = document.getElementById('turnDot');
    const aiThinkingStatus = document.getElementById('aiThinkingStatus');

    const modePvpBtn = document.getElementById('modePvpBtn');
    const modeAiBtn = document.getElementById('modeAiBtn');
    const aiDifficultyContainer = document.getElementById('aiDifficultyContainer');
    const diffButtons = document.querySelectorAll('.diff-btn');

    const resetRoundBtn = document.getElementById('resetRoundBtn');
    const resetScoreBtn = document.getElementById('resetScoreBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');

    // Settings Modal DOM
    const settingsModalBtn = document.getElementById('settingsModalBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsModal = document.getElementById('closeSettingsModal');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const inputNameX = document.getElementById('inputNameX');
    const inputNameO = document.getElementById('inputNameO');
    const pickXBtn = document.getElementById('pickXBtn');
    const pickOBtn = document.getElementById('pickOBtn');
    const modalSoundSwitch = document.getElementById('modalSoundSwitch');
    const soundSwitchKnob = document.getElementById('soundSwitchKnob');

    // Toast
    const gameToast = document.getElementById('gameToast');
    const toastMsg = document.getElementById('toastMsg');
    let toastTimeout = null;

    /* =====================================================================
       UI TOAST NOTIFIER (Replaces alert)
    ===================================================================== */
    function showToast(text, iconName = 'sparkles') {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.innerText = text;
      gameToast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
      gameToast.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        gameToast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
        gameToast.classList.remove('opacity-100', 'translate-y-0');
      }, 2600);
    }

    /* =====================================================================
       RENDER / UI UPDATE FUNCTIONS
    ===================================================================== */
    function updateScoreboard() {
      scoreXEl.innerText = state.scores.X;
      scoreOEl.innerText = state.scores.O;
      scoreDrawEl.innerText = state.scores.draws;
    }

    function updateTurnIndicator() {
      if (!state.gameActive) return;

      const isX = state.currentPlayer === 'X';
      const name = isX ? state.playerNames.X : state.playerNames.O;

      turnMessageEl.innerHTML = `Turn: <strong class="${isX ? 'text-cyan-400' : 'text-pink-400'} font-bold">${name} (${state.currentPlayer})</strong>`;

      if (isX) {
        turnPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75";
        turnDot.className = "relative inline-flex rounded-full h-3 w-3 bg-cyan-500";
        cardPlayerX.classList.add('glow-cyan', 'border-cyan-400');
        cardPlayerO.classList.remove('glow-pink', 'border-pink-400');
      } else {
        turnPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75";
        turnDot.className = "relative inline-flex rounded-full h-3 w-3 bg-pink-500";
        cardPlayerO.classList.add('glow-pink', 'border-pink-400');
        cardPlayerX.classList.remove('glow-cyan', 'border-cyan-400');
      }
    }

    function renderCell(index) {
      const cell = boardCells[index];
      const val = state.board[index];
      if (!val) {
        cell.innerHTML = '';
        cell.disabled = false;
        return;
      }

      cell.disabled = true;
      if (val === 'X') {
        cell.innerHTML = `<span class="text-cyan-400 text-glow-cyan transform transition duration-300 scale-100 inline-block">X</span>`;
      } else {
        cell.innerHTML = `<span class="text-pink-400 text-glow-pink transform transition duration-300 scale-100 inline-block">O</span>`;
      }
    }

    function renderFullBoard() {
      boardCells.forEach((_, idx) => {
        renderCell(idx);
        boardCells[idx].classList.remove('win-cell-x', 'win-cell-o');
      });
      updateTurnIndicator();
    }

    /* =====================================================================
       WIN & DRAW EVALUATION LOGIC
    ===================================================================== */
    function checkWinner(board) {
      for (const combo of WINNING_COMBOS) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], combo };
        }
      }
      if (board.every(cell => cell !== null)) {
        return { winner: 'draw', combo: null };
      }
      return null;
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.65 },
          colors: ['#06b6d4', '#ec4899', '#a855f7', '#3b82f6']
        });
      }
    }

    function handleGameOver(result) {
      state.gameActive = false;
      aiThinkingStatus.classList.add('hidden');

      if (result.winner === 'draw') {
        state.scores.draws++;
        updateScoreboard();
        sound.playDraw();
        turnMessageEl.innerHTML = `<span class="text-purple-300 font-bold">Stalemate! Game is a Draw.</span>`;
        turnPing.className = "hidden";
        showToast("It's a Draw! Well played.", "handshake");
      } else {
        const winnerMarker = result.winner;
        state.scores[winnerMarker]++;
        updateScoreboard();
        sound.playWin();
        triggerConfetti();

        // Highlight victorious row/column/diagonal
        result.combo.forEach(idx => {
          boardCells[idx].classList.add(winnerMarker === 'X' ? 'win-cell-x' : 'win-cell-o');
        });

        const winnerName = winnerMarker === 'X' ? state.playerNames.X : state.playerNames.O;
        const colorClass = winnerMarker === 'X' ? 'text-cyan-400' : 'text-pink-400';
        turnMessageEl.innerHTML = `<span class="${colorClass} font-black uppercase tracking-wider">★ ${winnerName} Wins! ★</span>`;
        showToast(`${winnerName} wins the match! 🎉`, "award");
      }
    }

    /* =====================================================================
       AI OPPONENT ALGORITHMS (Minimax, Tactical, Casual)
    ===================================================================== */
    function getAvailableMoves(board) {
      const moves = [];
      board.forEach((val, idx) => {
        if (!val) moves.push(idx);
      });
      return moves;
    }

    // Minimax Unbeatable Core
    function minimax(tempBoard, depth, isMaximizing, aiMark, humMark) {
      const outcome = checkWinner(tempBoard);
      if (outcome) {
        if (outcome.winner === aiMark) return 10 - depth;
        if (outcome.winner === humMark) return depth - 10;
        if (outcome.winner === 'draw') return 0;
      }

      const avail = getAvailableMoves(tempBoard);

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const idx of avail) {
          tempBoard[idx] = aiMark;
          const evaluation = minimax(tempBoard, depth + 1, false, aiMark, humMark);
          tempBoard[idx] = null;
          maxEval = Math.max(maxEval, evaluation);
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const idx of avail) {
          tempBoard[idx] = humMark;
          const evaluation = minimax(tempBoard, depth + 1, true, aiMark, humMark);
          tempBoard[idx] = null;
          minEval = Math.min(minEval, evaluation);
        }
        return minEval;
      }
    }

    function getBestMoveMinimax() {
      let bestScore = -Infinity;
      let move = -1;
      const avail = getAvailableMoves(state.board);

      for (const idx of avail) {
        state.board[idx] = state.aiMarker;
        const score = minimax(state.board, 0, false, state.aiMarker, state.humanMarker);
        state.board[idx] = null;
        if (score > bestScore) {
          bestScore = score;
          move = idx;
        }
      }
      return move;
    }

    // Intermediate Tactical AI: checks for direct wins or immediate blocks, else prefers center or random
    function getMediumMove() {
      const avail = getAvailableMoves(state.board);
      
      // 1. Can AI win right now?
      for (const idx of avail) {
        state.board[idx] = state.aiMarker;
        const result = checkWinner(state.board);
        state.board[idx] = null;
        if (result && result.winner === state.aiMarker) return idx;
      }

      // 2. Can opponent win right now? Block them!
      for (const idx of avail) {
        state.board[idx] = state.humanMarker;
        const result = checkWinner(state.board);
        state.board[idx] = null;
        if (result && result.winner === state.humanMarker) return idx;
      }

      // 3. Take Center if open (4)
      if (avail.includes(4) && Math.random() < 0.7) return 4;

      // 4. Fallback random
      return avail[Math.floor(Math.random() * avail.length)];
    }

    function getAiMove() {
      const avail = getAvailableMoves(state.board);
      if (avail.length === 0) return null;

      if (state.aiDifficulty === 'easy') {
        // Casual: 80% random, 20% tactical
        if (Math.random() < 0.2) return getMediumMove();
        return avail[Math.floor(Math.random() * avail.length)];
      } else if (state.aiDifficulty === 'medium') {
        // 75% Tactical, 25% Minimax
        if (Math.random() < 0.25) return getBestMoveMinimax();
        return getMediumMove();
      } else {
        // Unbeatable Minimax
        return getBestMoveMinimax();
      }
    }

    function triggerAiTurn() {
      if (!state.gameActive || state.currentPlayer !== state.aiMarker) return;

      state.isAiThinking = true;
      aiThinkingStatus.classList.remove('hidden');

      // Realistic thinking delay between 350ms - 550ms
      const delay = Math.floor(Math.random() * 200) + 350;

      setTimeout(() => {
        if (!state.gameActive || state.currentPlayer !== state.aiMarker) {
          state.isAiThinking = false;
          aiThinkingStatus.classList.add('hidden');
          return;
        }

        const move = getAiMove();
        state.isAiThinking = false;
        aiThinkingStatus.classList.add('hidden');

        if (move !== null && move >= 0) {
          applyMove(move);
        }
      }, delay);
    }

    /* =====================================================================
       PLAYER MOVE INTERACTION
    ===================================================================== */
    function applyMove(index) {
      if (state.board[index] || !state.gameActive) return;

      state.board[index] = state.currentPlayer;
      renderCell(index);

      // Play Sound
      if (state.currentPlayer === 'X') {
        sound.playPlaceX();
      } else {
        sound.playPlaceO();
      }

      // Check Outcome
      const outcome = checkWinner(state.board);
      if (outcome) {
        handleGameOver(outcome);
        return;
      }

      // Switch turn
      state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
      updateTurnIndicator();

      // Trigger AI if applicable
      if (state.gameMode === 'ai' && state.currentPlayer === state.aiMarker) {
        triggerAiTurn();
      }
    }

    function onCellClick(e) {
      if (!state.gameActive || state.isAiThinking) return;

      const btn = e.currentTarget;
      const index = parseInt(btn.dataset.index, 10);

      // If AI mode and not human turn, ignore
      if (state.gameMode === 'ai' && state.currentPlayer !== state.humanMarker) {
        return;
      }

      applyMove(index);
    }

    /* =====================================================================
       ROUND & SCORE RESET
    ===================================================================== */
    function resetRound(silent = false) {
      state.board = Array(9).fill(null);
      state.gameActive = true;
      state.isAiThinking = false;
      aiThinkingStatus.classList.add('hidden');

      // Starting turn defaults to X
      state.currentPlayer = 'X';

      renderFullBoard();
      if (!silent) {
        sound.playClick();
        showToast("New round initialized!");
      }

      // If AI plays first (AI is X)
      if (state.gameMode === 'ai' && state.aiMarker === 'X') {
        triggerAiTurn();
      }
    }

    function resetScore() {
      sound.playClick();
      state.scores = { X: 0, O: 0, draws: 0 };
      updateScoreboard();
      resetRound(true);
      showToast("Scoreboard reset to zero.", "trash-2");
    }

    /* =====================================================================
       GAME MODES & DIFFICULTY
    ===================================================================== */
    function setGameMode(mode) {
      sound.playClick();
      state.gameMode = mode;
      if (mode === 'pvp') {
        modePvpBtn.classList.add('active', 'text-white');
        modePvpBtn.classList.remove('text-slate-400');
        modeAiBtn.classList.remove('active', 'text-white');
        modeAiBtn.classList.add('text-slate-400');
        aiDifficultyContainer.classList.add('hidden');

        state.playerNames.O = inputNameO.value.trim() || 'Player 2';
        labelOEl.innerText = state.playerNames.O;
        showToast("Local 2-Player mode active", "users");
      } else {
        modeAiBtn.classList.add('active', 'text-white');
        modeAiBtn.classList.remove('text-slate-400');
        modePvpBtn.classList.remove('active', 'text-white');
        modePvpBtn.classList.add('text-slate-400');
        aiDifficultyContainer.classList.remove('hidden');

        state.playerNames.O = 'Cyborg AI';
        labelOEl.innerText = state.playerNames.O;
        showToast("VS AI mode active", "bot");
      }
      resetRound(true);
    }

    function setDifficulty(diff) {
      sound.playClick();
      state.aiDifficulty = diff;
      diffButtons.forEach(btn => {
        if (btn.dataset.difficulty === diff) {
          btn.className = "diff-btn px-2.5 py-1 rounded-lg bg-pink-500/20 text-pink-400 border border-pink-500/40 font-bold transition";
        } else {
          btn.className = "diff-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-medium transition";
        }
      });
      showToast(`AI Core set to ${diff.toUpperCase()}`);
      resetRound(true);
    }

    /* =====================================================================
       SETTINGS MODAL & CUSTOMIZATION
    ===================================================================== */
    function openModal() {
      sound.playClick();
      inputNameX.value = state.playerNames.X;
      inputNameO.value = state.playerNames.O;
      updateMarkerPickButtons();
      settingsModal.classList.remove('hidden');
      setTimeout(() => {
        settingsModal.classList.remove('opacity-0');
        settingsModal.firstElementChild.classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      sound.playClick();
      settingsModal.classList.add('opacity-0');
      settingsModal.firstElementChild.classList.add('scale-95');
      setTimeout(() => {
        settingsModal.classList.add('hidden');
      }, 200);
    }

    function updateMarkerPickButtons() {
      if (state.humanMarker === 'X') {
        pickXBtn.className = "py-2 rounded-xl border border-cyan-500 bg-cyan-500/25 text-cyan-300 font-neon font-bold text-center";
        pickOBtn.className = "py-2 rounded-xl border border-white/10 glass-inset text-slate-400 hover:text-pink-300 font-neon font-bold text-center";
      } else {
        pickOBtn.className = "py-2 rounded-xl border border-pink-500 bg-pink-500/25 text-pink-300 font-neon font-bold text-center";
        pickXBtn.className = "py-2 rounded-xl border border-white/10 glass-inset text-slate-400 hover:text-cyan-300 font-neon font-bold text-center";
      }
    }

    function applySettings() {
      const nameX = inputNameX.value.trim() || 'Player 1';
      const nameO = inputNameO.value.trim() || (state.gameMode === 'ai' ? 'Cyborg AI' : 'Player 2');

      state.playerNames.X = nameX;
      state.playerNames.O = nameO;

      labelXEl.innerText = nameX;
      labelOEl.innerText = nameO;

      closeModal();
      showToast("Settings applied!");
      resetRound(true);
    }

    function toggleSound() {
      sound.muted = !sound.muted;
      if (sound.muted) {
        soundIcon.setAttribute('data-lucide', 'volume-x');
        modalSoundSwitch.className = "w-12 h-6 flex items-center bg-slate-700 rounded-full p-1 duration-300 cursor-pointer";
        soundSwitchKnob.className = "bg-white w-4 h-4 rounded-full shadow-md transform translate-x-0 duration-300";
        showToast("Audio muted");
      } else {
        sound.initContext();
        soundIcon.setAttribute('data-lucide', 'volume-2');
        modalSoundSwitch.className = "w-12 h-6 flex items-center bg-cyan-600 rounded-full p-1 duration-300 cursor-pointer";
        soundSwitchKnob.className = "bg-white w-4 h-4 rounded-full shadow-md transform translate-x-6 duration-300";
        sound.playClick();
        showToast("Audio unmuted");
      }
      lucide.createIcons();
    }

    /* =====================================================================
       EVENT LISTENERS
    ===================================================================== */
    boardCells.forEach(cell => {
      cell.addEventListener('click', onCellClick);
    });

    modePvpBtn.addEventListener('click', () => setGameMode('pvp'));
    modeAiBtn.addEventListener('click', () => setGameMode('ai'));

    diffButtons.forEach(btn => {
      btn.addEventListener('click', () => setDifficulty(btn.dataset.difficulty));
    });

    resetRoundBtn.addEventListener('click', () => resetRound());
    resetScoreBtn.addEventListener('click', resetScore);

    soundToggleBtn.addEventListener('click', toggleSound);
    modalSoundSwitch.addEventListener('click', toggleSound);

    settingsModalBtn.addEventListener('click', openModal);
    closeSettingsModal.addEventListener('click', closeModal);
    saveSettingsBtn.addEventListener('click', applySettings);

    // Marker switch within settings
    pickXBtn.addEventListener('click', () => {
      sound.playClick();
      state.humanMarker = 'X';
      state.aiMarker = 'O';
      updateMarkerPickButtons();
    });
    pickOBtn.addEventListener('click', () => {
      sound.playClick();
      state.humanMarker = 'O';
      state.aiMarker = 'X';
      updateMarkerPickButtons();
    });

    // Close modal on click backdrop
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeModal();
    });

    // Initialize on window load
    window.onload = () => {
      lucide.createIcons();
      updateScoreboard();
      renderFullBoard();
    };
  </script>
</body>
</html>
